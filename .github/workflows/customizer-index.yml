# Customizer design index. The "Customize Your Jewellery" form reads
# assets/customizer-index.json to know which design images exist (one request
# instead of thousands of CDN guesses, see scripts/build_customizer_index.py).
# Whenever design images are added, renamed or removed on main, this rebuilds
# the index from the git tree (file names only: the 1.5 GB of images is never
# downloaded) and commits it through the GitHub API. That commit reaches the
# live theme through the Shopify GitHub integration like any other.
name: Customizer design index

on:
  push:
    branches: [main]
    paths:
      - 'assets/ring_*'
      - 'assets/pendant_*'
      - 'assets/bracelet_*'
      - 'scripts/build_customizer_index.py'
      - '.github/workflows/customizer-index.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: customizer-index
  cancel-in-progress: true   # only the newest tree matters

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none          # trees only; no image bytes
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true

      - name: Build the index from file names in the tree
        run: |
          git ls-tree -r --name-only HEAD -- assets \
            | python3 scripts/build_customizer_index.py --from-stdin -o /tmp/customizer-index.json

      - name: Commit it if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=assets/customizer-index.json
          api="repos/$GITHUB_REPOSITORY/contents/$path"
          sha=$(gh api "$api?ref=main" --jq .sha 2>/dev/null || true)
          if [ -n "$sha" ] && gh api "$api?ref=main" -H 'Accept: application/vnd.github.raw' > /tmp/current.json 2>/dev/null \
             && cmp -s /tmp/current.json /tmp/customizer-index.json; then
            echo "Index unchanged, nothing to commit." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          jq -n --arg message "customizer: rebuild design index (${GITHUB_SHA::7})" \
                --arg content "$(base64 -w0 /tmp/customizer-index.json)" \
                --arg sha "$sha" --arg branch main \
                '{message: $message, content: $content, branch: $branch} + (if $sha != "" then {sha: $sha} else {} end)' \
            > /tmp/body.json
          gh api -X PUT "$api" --input /tmp/body.json --jq '.commit.sha' | sed 's/^/Committed index as /' | tee -a "$GITHUB_STEP_SUMMARY"
