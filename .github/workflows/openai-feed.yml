# OpenAI Ads product feed, secondary path. The primary sync is a launchd job on the owner's Mac
# (every 15 min, see marketing/openai-feed/README.md) because Shopify throttles the shared IP ranges
# GitHub runners use. This workflow still tries hourly, on a Shopify Flow ping and by hand, and
# uploads when it manages to build a changed catalogue; when the store refuses it, it logs a warning.
name: OpenAI product feed sync

on:
  schedule:
    - cron: '7 * * * *'
  repository_dispatch:
    types: [catalog-changed]
  workflow_dispatch:
    inputs:
      force:
        description: 'Upload even if the catalogue is unchanged'
        type: boolean
        default: false

concurrency:
  group: openai-feed
  cancel-in-progress: false   # never cancel mid-upload: a half-written CSV in the SFTP root could wipe the catalogue

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build the catalogue from the live store
        id: build
        continue-on-error: true
        run: python3 marketing/openai-feed/openai_feed.py build

      - name: Store refused this runner
        if: steps.build.outcome != 'success'
        run: echo "::warning::Shopify throttled or refused the GitHub runner (see the build step). Nothing uploaded; the Mac-side job and the next run will retry."

      - name: Fingerprint it
        if: steps.build.outcome == 'success'
        id: fp
        run: echo "sha=$(sha256sum marketing/openai-product-feed.csv | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Was this exact catalogue already uploaded?
        if: steps.build.outcome == 'success'
        id: seen
        uses: actions/cache@v4
        with:
          path: .openai-feed-uploaded
          key: openai-feed-uploaded-${{ steps.fp.outputs.sha }}

      - name: Nothing changed
        if: steps.build.outcome == 'success' && steps.seen.outputs.cache-hit == 'true' && github.event.inputs.force != 'true'
        run: echo "Catalogue unchanged since the last upload (${{ steps.fp.outputs.sha }}). Nothing to push."

      - name: Install expect (drives sftp with the password login)
        if: steps.build.outcome == 'success' && (steps.seen.outputs.cache-hit != 'true' || github.event.inputs.force == 'true')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq expect

      - name: Upload over SFTP
        if: steps.build.outcome == 'success' && (steps.seen.outputs.cache-hit != 'true' || github.event.inputs.force == 'true')
        env:
          OPENAI_ADS_API_KEY: ${{ secrets.OPENAI_ADS_API_KEY }}
          OPENAI_ADS_FEED_ID: ${{ secrets.OPENAI_ADS_FEED_ID }}
          OPENAI_FEED_SFTP_HOST: ${{ secrets.OPENAI_FEED_SFTP_HOST }}
          OPENAI_FEED_SFTP_PORT: ${{ secrets.OPENAI_FEED_SFTP_PORT }}
          OPENAI_FEED_SFTP_USER: ${{ secrets.OPENAI_FEED_SFTP_USER }}
          OPENAI_FEED_SFTP_PASSWORD: ${{ secrets.OPENAI_FEED_SFTP_PASSWORD }}
        run: |
          echo "trigger: ${{ github.event_name }} ${{ github.event.client_payload.trigger }} ${{ github.event.client_payload.handle }}"
          echo "::group::Result of the previous upload (OpenAI publishes it ~7 min after a push)"
          python3 marketing/openai-feed/openai_feed.py status || true
          echo "::endgroup::"
          python3 marketing/openai-feed/openai_feed.py upload
          date -u +%FT%TZ > .openai-feed-uploaded
